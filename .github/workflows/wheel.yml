name: wheel

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wheel-${{ github.ref }}-${{ matrix.os }}
  cancel-in-progress: true

jobs:
  build-wheel:
    name: Native wheel (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install wheel build frontend
        run: python -m pip install --upgrade pip build
      - name: Build wheel
        run: python -m build --wheel
      - name: Install produced wheel
        run: python -m pip install --force-reinstall dist/*.whl
      - name: Verify packaged C ABI
        run: >-
          python -c "import pathlib, spacepdhcg;
          from spacepdhcg.native import c_api_version, native_available, native_version, packaged_library_path;
          path=packaged_library_path();
          assert pathlib.Path(path).is_file();
          assert native_available();
          assert c_api_version()==1;
          assert native_version()==spacepdhcg.__version__;
          print(path)"
      - uses: actions/upload-artifact@v4
        with:
          name: spacepdhcg-wheel-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error
