name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native-interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate persistent C++ interface
        run: >-
          c++ -std=c++20 -Wall -Wextra -Wpedantic -Werror
          -Icpp/include -fsyntax-only cpp/tests/interface_smoke.cpp

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest --cov=spacepdhcg --cov-report=term-missing
      - name: Persistent QP benchmark smoke test
        run: spacepdhcg-cw-benchmark --repeats 3 --intervals 12 --tolerance 1e-6
      - name: Persistent SOCP benchmark smoke test
        run: spacepdhcg-cw-socp-benchmark --repeats 3 --intervals 12 --tolerance 1e-7
      - name: Random trajectory-banded correctness smoke test
        run: spacepdhcg-banded-correctness --seeds 7 --intervals 4 --tolerance 1e-7
      - name: Nonlinear 3-DoF SCvx smoke test
        run: >-
          spacepdhcg-powered-descent-scvx
          --intervals 6 --step-seconds 2.0 --max-iterations 3 --tolerance 5e-3
