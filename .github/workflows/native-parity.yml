name: native-parity

on:
  push:
    branches: [main]
    paths:
      - "cpp/native/**"
      - "cpp/include/**"
      - "src/spacepdhcg/models/cw.py"
      - "tests/native_cw_parity.py"
      - ".github/workflows/native-parity.yml"
  pull_request:
    paths:
      - "cpp/native/**"
      - "cpp/include/**"
      - "src/spacepdhcg/models/cw.py"
      - "tests/native_cw_parity.py"
      - ".github/workflows/native-parity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c-abi-python-parity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build native core
        run: |
          cmake -S cpp/native -B build/native-core -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native-core --parallel 2
      - name: Install Python reference package
        run: python -m pip install -e .
      - name: Cross-check native HCW matrices
        run: python tests/native_cw_parity.py build/native-core/libspacepdhcg_native_core.so
