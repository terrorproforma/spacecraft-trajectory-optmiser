name: condensed-diagnostic

on:
  push:
    branches: [feat/pre-gpu-roadmap-completion]
  pull_request:
    paths:
      - src/spacepdhcg/distributed/condensed_cqp.py
      - src/spacepdhcg/benchmarks/condensed_correctness.py
      - tests/test_robust_cqp.py
      - .github/workflows/condensed-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install reference dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Diagnose condensed identical-scenario equivalence
        run: python -m spacepdhcg.benchmarks.condensed_correctness
