name: full-gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: C++20 native core
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S cpp -B build/native
          -DBUILD_TESTING=ON
          -DSPACEPDHCG_BUILD_C_API=ON
          -DSPACEPDHCG_BUILD_NATIVE_TESTS=ON
          -DSPACEPDHCG_NATIVE_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build/native --parallel 2
      - name: Test
        run: ctest --test-dir build/native --output-on-failure

  native-sanitizers:
    name: C++20 ASan and UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S cpp -B build/sanitizers
          -DBUILD_TESTING=ON
          -DSPACEPDHCG_BUILD_C_API=ON
          -DSPACEPDHCG_BUILD_NATIVE_TESTS=ON
          -DSPACEPDHCG_NATIVE_WARNINGS_AS_ERRORS=ON
          -DSPACEPDHCG_NATIVE_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build/sanitizers --parallel 2
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build/sanitizers --output-on-failure

  python-reference:
    name: Python ${{ matrix.python-version }} reference and parity
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest --cov=spacepdhcg --cov-report=term-missing
