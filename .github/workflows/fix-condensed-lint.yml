name: fix-condensed-lint

on:
  push:
    branches: [feat/pre-gpu-roadmap-completion]
    paths:
      - .github/workflows/fix-condensed-lint.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pre-gpu-roadmap-completion
          fetch-depth: 0
      - name: Remove stale statement
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/spacepdhcg/distributed/condensed_cqp.py")
          text = path.read_text(encoding="utf-8")
          old = "        del scenario\n"
          if text.count(old) != 1:
              raise RuntimeError("expected exactly one stale scenario deletion")
          path.write_text(text.replace(old, "", 1), encoding="utf-8")
          PY
          git rm -f .github/workflows/fix-condensed-lint.yml
      - name: Commit lint repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/spacepdhcg/distributed/condensed_cqp.py
          git commit -m "fix: complete condensed CQP lint cleanup"
          git push origin HEAD:feat/pre-gpu-roadmap-completion
