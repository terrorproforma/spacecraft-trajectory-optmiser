[build-system]
requires = ["scikit-build-core>=1.0,<2"]
build-backend = "scikit_build_core.build"

[project]
name = "spacepdhcg"
version = "0.1.0.dev0"
description = "Persistent conic optimisation infrastructure for robust spacecraft trajectory optimisation"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "SpacePDHCG contributors" }]
dependencies = [
  "clarabel>=0.11.0",
  "jsonschema>=4.26",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "scipy>=1.12",
  "osqp>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "jsonschema>=4.26",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.9",
]

[project.scripts]
spacepdhcg = "spacepdhcg.cli:main"
spacepdhcg-banded-correctness = "spacepdhcg.benchmarks.banded_correctness:main"
spacepdhcg-g1-correctness = "spacepdhcg.benchmarks.g1_correctness:main"
spacepdhcg-cw-benchmark = "spacepdhcg.benchmarks.cw_repeat:main"
spacepdhcg-cw-socp-benchmark = "spacepdhcg.benchmarks.cw_socp_repeat:main"
spacepdhcg-powered-descent-scvx = "spacepdhcg.benchmarks.powered_descent_scvx:main"
spacepdhcg-scenario-layout = "spacepdhcg.benchmarks.scenario_layout:main"
spacepdhcg-paper1 = "spacepdhcg.paper1.cli:main"
spacepdhcg-orbitweaver-g7 = "spacepdhcg.orbitweaver.cli:main"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.source-dir = "cpp"
cmake.build-type = "Release"
wheel.packages = ["src/spacepdhcg"]
wheel.reproducible = true
sdist.reproducible = true
sdist.include = [
  "cpp/**",
  "docs/**",
  "experiments/**",
  "papers/**",
  "scripts/**",
  "src/**",
  "tests/**",
  "third_party/*.lock.json",
  "third_party/patches/**",
  "README.md",
  "pyproject.toml",
]

[tool.scikit-build.cmake.define]
SPACEPDHCG_BUILD_C_API = "ON"
SPACEPDHCG_BUILD_NATIVE_TESTS = "OFF"
SPACEPDHCG_NATIVE_WARNINGS_AS_ERRORS = "ON"
SPACEPDHCG_PYTHON_WHEEL = "ON"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B018"]
"src/spacepdhcg/scvx/powered_descent_3dof.py" = ["I001", "F401"]
