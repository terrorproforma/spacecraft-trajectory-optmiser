name: apply-native-driver-patch

on:
  push:
    branches: [feat/pre-gpu-roadmap-completion]
    paths:
      - tools/apply_native_driver_patch.py
      - .github/workflows/apply-native-driver-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pre-gpu-roadmap-completion
          fetch-depth: 0
      - name: Apply asserted source migration
        run: python tools/apply_native_driver_patch.py
      - name: Commit migrated native sources
        run: |
          if git diff --quiet; then
            echo "Migration already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cpp/include/spacepdhcg
          git commit -m "fix: complete native SCvx driver and 6-DoF Euler interfaces"
          git push origin HEAD:feat/pre-gpu-roadmap-completion
