[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spacepdhcg"
version = "0.1.0.dev0"
description = "Persistent conic optimisation infrastructure for robust spacecraft trajectory optimisation"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "SpacePDHCG contributors" }]
dependencies = [
  "clarabel>=0.11.0",
  "numpy>=1.26",
  "scipy>=1.12",
  "osqp>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.9",
]

[project.scripts]
spacepdhcg-banded-correctness = "spacepdhcg.benchmarks.banded_correctness:main"
spacepdhcg-cw-benchmark = "spacepdhcg.benchmarks.cw_repeat:main"
spacepdhcg-cw-socp-benchmark = "spacepdhcg.benchmarks.cw_socp_repeat:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B018"]
