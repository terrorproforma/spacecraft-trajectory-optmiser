name: finalize-pre-gpu-cleanup

on:
  push:
    branches: [feat/pre-gpu-roadmap-completion]
    paths:
      - .github/workflows/finalize-pre-gpu-cleanup.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pre-gpu-roadmap-completion
          fetch-depth: 0
      - name: Fix remaining reference-layer lint defect
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/spacepdhcg/distributed/condensed_cqp.py")
          text = path.read_text(encoding="utf-8")
          old = "        for scenario, mapping in enumerate(self._local_to_global):\n"
          new = "        for _scenario, mapping in enumerate(self._local_to_global):\n"
          if text.count(old) != 1:
              raise RuntimeError("expected exactly one unused scenario loop variable")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Remove one-shot migration machinery
        run: |
          git rm -f \
            tools/apply_higher_order_transcription_patch.py \
            tools/apply_native_driver_patch.py \
            tools/apply_rollout_boundary_patch.py \
            .github/workflows/apply-higher-order-transcription.yml \
            .github/workflows/apply-native-driver-patch.yml \
            .github/workflows/apply-rollout-boundary-patch.yml \
            .github/workflows/finalize-pre-gpu-cleanup.yml
      - name: Commit final cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/spacepdhcg/distributed/condensed_cqp.py
          git commit -m "chore: remove one-shot migrations and restore lint gate"
          git push origin HEAD:feat/pre-gpu-roadmap-completion
